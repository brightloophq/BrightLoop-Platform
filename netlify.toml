# =============================================================================
# Netlify configuration — BrightLoop Platform (pnpm workspaces + Turborepo).
#
# RUNTIME: Next.js 15 needs the v5 (OpenNext) runtime. The legacy v4 runtime
# (bundled in the build image, forced when the plugin is declared in [[plugins]])
# is EOL and incompatible with Next 15 middleware — it produced a working build
# but every route 500'd at runtime, and its Edge bundler couldn't resolve
# @opentelemetry/api. So we do NOT declare the plugin here.
#
# For Netlify to auto-detect Next.js and install the v5 runtime in a monorepo, the
# BASE must be the app package (where `next` is a dependency) — detection at the
# workspace root fails (no `next` there), which is why an earlier attempt 404'd.
# The build command then reaches up to the workspace root so Turborepo compiles
# the @brightloop/* packages (consumed as built dist) BEFORE the web app.
#
# This is a full SSR deploy — App Router, SSR, middleware, API routes, auth,
# Supabase, /admin and /portal preserved. NOT a static export.
#
# REQUIRED ENV VARS (Netlify UI → Environment variables; values not stored here):
#   build + client: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
#   runtime:        SUPABASE_SECRET_KEY, TURNSTILE_SECRET_KEY,
#                   NEXT_PUBLIC_TURNSTILE_SITE_KEY, (opt) STRIPE_*, ESIGN_*,
#                   EMAIL_PROVIDER_API_KEY, N8N_WEBHOOK_SECRET.
# =============================================================================

[build]
  # Base = the Next.js app package, so Netlify detects Next 15 and runs the v5
  # (OpenNext) runtime. `pnpm install` here still installs the whole pnpm
  # workspace (pnpm resolves the workspace root from a member).
  base = "application/apps/web"
  # Reach up to the workspace root and build via Turborepo (deps first, then web).
  command = "cd ../.. && pnpm build"
  # The web app's server build output, relative to base (application/apps/web/.next).
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_* values are PUBLIC by design (inlined into client/edge bundles).
  # Allow the secrets scanner to see these specific public keys while it keeps
  # scanning for real server secrets (which are correctly absent from the bundle).
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_TURNSTILE_SITE_KEY,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"

# No [[plugins]] block on purpose — with base at the app package, Netlify
# auto-detects Next.js and installs/runs the latest v5 (OpenNext) runtime.
