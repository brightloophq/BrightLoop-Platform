# gitleaks config for CI secret scanning (see .github/workflows/ci.yml).
# Uses the default rule set; allowlists the env TEMPLATE, whose values are
# deliberate placeholders (sb_secret_..., sk_test_..., whsec_..., 0x...).
[extend]
useDefault = true

[allowlist]
description = "Env template placeholders + test fixtures — not real secrets"
paths = [
  '''application/\.env\.example''',
  # F3 Execution Runtime tests use placeholder secret fixtures (never real): the
  # application suite registers a runtime with a placeholder API key + asserts it
  # never leaks; the domain suite feeds fake secret-shaped values (sk_live_…,
  # Bearer …, api_key=…) purely to prove the redaction/sanitization helpers strip
  # them. Both are self-contained test doubles, not credentials.
  '''application/packages/(application|domain)/src/execution-runtime/execution-runtime\.test\.ts''',
]
