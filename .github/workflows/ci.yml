name: CI

# Free, private-repo-friendly substitute for paid branch protection: runs the
# full quality gate + a secret scan on every push to main and every PR. A bad
# commit or a leaked credential shows a red ✗ automatically.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    # CI builds against the PLACEHOLDER data source — no real database and no
    # secrets. The dummy public vars only satisfy the "is Supabase configured"
    # gate during static generation; placeholder mode means nothing connects.
    env:
      BRIGHTLOOP_DATA_SOURCE: placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_ci
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: application/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  db-verify:
    name: migrate · pgTAP · RLS · adapter · type-drift
    runs-on: ubuntu-latest
    # Live database gate: spins up a real ephemeral Supabase (Postgres) via the
    # Supabase CLI + Docker, applies every migration from a clean DB, then runs
    # the pgTAP suite, the cross-tenant RLS tests, and the Sprint 2 transformation
    # adapter integration tests against it. No production keys — every credential
    # comes from the local stack's own `supabase status`.
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: application/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (Docker)
        run: supabase start

      # Clean apply of every migration + seed. Fails the job on any migration error.
      - name: Reset database (clean migrate + seed)
        run: supabase db reset

      # Transition guards + RLS / cross-tenant coverage. Fails on any failed assertion.
      - name: Run pgTAP tests
        run: supabase test db

      # Exercise the real Supabase transformation adapter (Sprint 2) end-to-end,
      # including the human-approval gate, idempotent execution, and cross-tenant
      # isolation. Credentials are pulled from the running local stack only.
      - name: Run adapter integration tests
        run: |
          set -a
          eval "$(supabase status -o env)"
          export SUPABASE_TEST_URL="$API_URL"
          export SUPABASE_TEST_SERVICE_KEY="$SERVICE_ROLE_KEY"
          export SUPABASE_TEST_ANON_KEY="$ANON_KEY"
          export SUPABASE_TEST_JWT_SECRET="$JWT_SECRET"
          set +a
          pnpm --filter @brightloop/data test:integration

      # Regenerate types from the live migrated schema.
      - name: Regenerate generated types
        run: pnpm --filter @brightloop/db gen:types:local

      # Publish the freshly generated file so a genuine drift can be resolved by
      # committing the SUPABASE-GENERATED output (never hand-authored). Uploaded
      # before the drift gate so it is captured even when the gate fails.
      - name: Upload generated types
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-db-types
          path: application/packages/db/generated/database.types.ts
          if-no-files-found: error

      # Fail if the regenerated types drift from the committed file (stale
      # generated types must never merge).
      - name: Fail on generated-type drift
        run: |
          git diff --exit-code -- packages/db/generated/database.types.ts \
            || (echo "::error::Generated database types are stale. Download the 'generated-db-types' artifact (or run 'pnpm --filter @brightloop/db gen:types:local' locally) and commit packages/db/generated/database.types.ts." && exit 1)

      - name: Stop Supabase
        if: always()
        run: supabase stop

  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the scan covers every commit

      - name: Run gitleaks (fails the build on any finding)
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1
