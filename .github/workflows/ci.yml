name: CI

# Free, private-repo-friendly substitute for paid branch protection: runs the
# full quality gate + a secret scan on every push to main and every PR. A bad
# commit or a leaked credential shows a red ✗ automatically.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    # CI builds against the PLACEHOLDER data source — no real database and no
    # secrets. The dummy public vars only satisfy the "is Supabase configured"
    # gate during static generation; placeholder mode means nothing connects.
    env:
      BRIGHTLOOP_DATA_SOURCE: placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_ci
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: application/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  db-verify:
    name: migrate · pgTAP · approval races · browser · type-drift
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: application/pnpm-lock.yaml

      - name: Install dependencies (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Check local-target guard regressions
        run: node --test scripts/with-local-db.test.mjs

      - name: Prepare an unlinked disposable project
        run: node scripts/prepare-ci-db.mjs

      # Fresh workdir + unique project: start applies all migrations, no reset.
      - name: Start disposable Supabase and apply migration chain
        run: supabase start --workdir "$AUXION_DB_WORKDIR"

      - name: Run pgTAP tests
        run: supabase test db --local --workdir "$AUXION_DB_WORKDIR"

      - name: Build workspace dependencies
        run: pnpm -r --filter @brightloop/schema --filter @brightloop/domain --filter @brightloop/application --filter @brightloop/data --filter @brightloop/providers --filter @brightloop/crawler build

      # The wrapper verifies loopback ports and the actual Docker project label,
      # masks local credentials, and sets SUPABASE_TEST_DB_CONTAINER. Missing
      # container configuration is fatal, so both concurrency cases must execute.
      - name: Run adapter integration tests including real approval races
        run: node scripts/with-local-db.mjs -- pnpm --filter @brightloop/data test:integration

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build browser acceptance app against local Supabase
        run: node scripts/with-local-db.mjs -- pnpm --filter @brightloop/web build

      - name: Run commercial browser acceptance
        run: node scripts/with-local-db.mjs -- pnpm test:browser

      # These suites must also pass with persistent adapter/browser fixtures.
      - name: Run full SQL suite after adapters and browser tests
        if: always() && env.AUXION_DB_WORKDIR != ''
        run: supabase test db --local --workdir "$AUXION_DB_WORKDIR"

      - name: Regenerate generated types from disposable database
        if: always() && env.AUXION_DB_WORKDIR != ''
        run: supabase gen types typescript --local --workdir "$AUXION_DB_WORKDIR" > packages/db/generated/database.types.ts

      - name: Upload generated types
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-db-types
          path: application/packages/db/generated/database.types.ts
          if-no-files-found: error

      - name: Fail on generated-type drift
        run: git diff --exit-code -- packages/db/generated/database.types.ts

      - name: Stop only the disposable project
        if: always() && env.AUXION_DB_WORKDIR != ''
        run: supabase stop --workdir "$AUXION_DB_WORKDIR"

  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the scan covers every commit

      - name: Run gitleaks (fails the build on any finding)
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  # ───────────────────────────────────────────────────────────────────────────
  # Says, ON THE PULL REQUEST, that merging this will need a `supabase db push`.
  #
  # The incident this prevents needed no automation to prevent: app code that
  # read a new column shipped before its migration reached the database, and the
  # admin stopped loading. Nobody had forgotten how to run the command — nobody
  # knew there was one to run.
  #
  # So this asks for no credentials and touches no database. It reads the diff,
  # and when a pull request adds a migration it says so while there is still
  # somebody looking at the page. Green either way: it is a note, not a gate.
  # ───────────────────────────────────────────────────────────────────────────
  migrations:
    name: migrations · manual push reminder
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the base branch to diff against

      - name: Report any migrations this pull request adds
        run: |
          base="origin/${{ github.base_ref }}"
          added=$(git diff --name-only --diff-filter=A "$base...HEAD" \
            -- application/supabase/migrations || true)

          if [ -z "$added" ]; then
            echo "No new migrations in this pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## This pull request adds migrations"
            echo
            echo "$added" | sed 's|application/supabase/migrations/|- `|; s|$|`|'
            echo
            echo "**They do not reach the database by merging**, unless automatic"
            echo "migration is configured (see \`packages/db/README.md\`). Until it is,"
            echo "run this from a checkout of \`main\` AFTER merging and BEFORE relying"
            echo "on any page that reads the new schema:"
            echo
            echo '```bash'
            echo "cd application"
            echo "supabase db push"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          count=$(echo "$added" | wc -l | tr -d ' ')
          echo "::warning::This pull request adds $count migration(s). Run 'supabase db push' after merging — merging alone does not apply them."
