<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 420" role="img" aria-label="Auxion">
  <!-- Canonical Auxion lockup master, on the identity's native black ground.
       Standalone file: the gold stops are the literal --brand-* dark-theme
       values from application/packages/ui/src/tokens/colors.css. The in-product
       version is <Logo variant="lockup" /> in @brightloop/ui, which resolves the
       same geometry from tokens so it also works on paper. -->
  <defs>
    <linearGradient id="ribbon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5E410F" />
      <stop offset="0.22" stop-color="#C9A24B" />
      <stop offset="0.5" stop-color="#F2E6C6" />
      <stop offset="0.78" stop-color="#C9A24B" />
      <stop offset="1" stop-color="#96691C" />
    </linearGradient>
    <linearGradient id="leg" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5E410F" />
      <stop offset="0.55" stop-color="#96691C" />
      <stop offset="1" stop-color="#C9A24B" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#96691C" />
      <stop offset="0.5" stop-color="#C9A24B" />
      <stop offset="1" stop-color="#5E410F" />
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#96691C" />
      <stop offset="0.42" stop-color="#F2E6C6" />
      <stop offset="1" stop-color="#C9A24B" />
    </linearGradient>
  </defs>
  <g transform="translate(0,10) scale(0.6667)">
    <polygon points="250,395 392,395 416,455 207,455" fill="url(#bar)" />
    <polygon points="446,530 530,530 364.7,116.8 310.9,192.3" fill="url(#leg)" />
    <polygon points="70,530 154,530 500,45 416,45" fill="url(#ribbon)" />
    <polygon points="70,530 88,530 434,45 416,45" fill="#F2E6C6" opacity="0.55" />
  </g>
  <text x="470" y="292" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="600"
        font-size="196" letter-spacing="48" fill="url(#word)">AUXION</text>
</svg>
